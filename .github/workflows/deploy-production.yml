name: Deploy Prod

run-name: deploy-production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch or tag)'
        required: false
        type: string
        default: main
      domain_name:
        description: 'Custom domain (optional; falls back to PRODUCTION_DOMAIN repository variable)'
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DO_TOKEN: ${{ secrets.DO_TOKEN }}

jobs:
  deploy:
    name: Deploy Prod
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: production
      deployment_id: production
      terraform_dir: terraform/production
      backend_key: production/production.tfstate
      image_tag: production
      vpc_name: production
      app_name: production
      migration_app_name: production-migrations
      db_name: production
      project_name: budget-prod
      domain_name: ${{ inputs.domain_name || vars.PRODUCTION_DOMAIN }}
      git_ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
    secrets:
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      TERRAFORM_AWS_S3_ACCESS_KEY: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY }}
      TERRAFORM_AWS_S3_ACCESS_KEY_SECRET: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY_SECRET }}
      TERRAFORM_AWS_S3_REGION: ${{ secrets.TERRAFORM_AWS_S3_REGION }}

  prepare-notify:
    name: Prepare Deploy Notification
    needs: deploy
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    outputs:
      should_deliver: ${{ steps.message.outputs.should_deliver }}
    steps:
    - name: Download deploy-result artifact
      uses: actions/download-artifact@v8
      with:
        name: deploy-result

    - name: Build production deploy notification
      id: message
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_PROD }}
      run: |
        set -euo pipefail
        if [ ! -f deploy-result.json ]; then
          echo "No deploy-result artifact — deploy did not run"
          echo "should_deliver=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        DEPLOYMENT_SUCCESS=$(jq -r '.deployment_success' deploy-result.json)
        APP_URL=$(jq -r '.app_url // empty' deploy-result.json)
        IMAGE_TAG=$(jq -r '.image_tag // empty' deploy-result.json)
        GIT_SHA=$(jq -r '.git_sha // empty' deploy-result.json)
        CHECK_BUILDS=$(jq -r '.jobs.check_builds' deploy-result.json)
        BUILD_GO=$(jq -r '.jobs.build_go' deploy-result.json)
        BUILD_DOCKER=$(jq -r '.jobs.build_docker' deploy-result.json)
        DEPLOY_JOB=$(jq -r '.jobs.deploy' deploy-result.json)

        if [ "$DEPLOYMENT_SUCCESS" = "true" ] && [ "$DEPLOY_JOB" = "success" ]; then
          jq -n \
            --arg sha "$GIT_SHA" \
            --arg tag "$IMAGE_TAG" \
            --arg url "$APP_URL" \
            --arg run "$RUN_URL" \
            '{
              text: "✅ Production Deployment Successful",
              attachments: [{
                color: "good",
                fields: [
                  {title: "Commit", value: $sha, short: true},
                  {title: "Image Tag", value: $tag, short: true},
                  {title: "Application URL", value: $url, short: false},
                  {title: "Workflow Run", value: $run, short: false}
                ]
              }]
            }' > slack-payload.json
        else
          FAILED_STEP="Unknown"
          ERROR_MESSAGE="Workflow execution failed"
          if [ "$CHECK_BUILDS" = "failure" ]; then
            FAILED_STEP="Check build requirements"
            ERROR_MESSAGE="Build requirement analysis failed."
          elif [ "$BUILD_GO" = "failure" ]; then
            FAILED_STEP="Build Go binary"
            ERROR_MESSAGE="Go binary build failed."
          elif [ "$BUILD_DOCKER" = "failure" ]; then
            FAILED_STEP="Build Docker image"
            ERROR_MESSAGE="Docker image build or push failed."
          elif [ "$DEPLOY_JOB" = "failure" ]; then
            FAILED_STEP="Deploy infrastructure"
            ERROR_MESSAGE="Terraform deployment failed."
          elif [ "$DEPLOY_JOB" = "skipped" ]; then
            FAILED_STEP="Deploy skipped"
            ERROR_MESSAGE="Deploy was skipped because an earlier job failed."
          fi

          jq -n \
            --arg sha "$GIT_SHA" \
            --arg step "$FAILED_STEP" \
            --arg error "$ERROR_MESSAGE" \
            --arg run "$RUN_URL" \
            '{
              text: "❌ Production Deployment Failed",
              attachments: [{
                color: "danger",
                fields: [
                  {title: "Commit", value: $sha, short: true},
                  {title: "Failed Step", value: $step, short: true},
                  {title: "Error", value: $error, short: false},
                  {title: "Workflow Run", value: $run, short: false}
                ]
              }]
            }' > slack-payload.json
        fi

        SHOULD_DELIVER=false
        if [ -n "$SLACK_WEBHOOK" ] && [ -f slack-payload.json ]; then
          SHOULD_DELIVER=true
        fi
        echo "should_deliver=${SHOULD_DELIVER}" >> "$GITHUB_OUTPUT"

    - name: Upload Slack payload
      if: steps.message.outputs.should_deliver == 'true' && hashFiles('slack-payload.json') != ''
      uses: actions/upload-artifact@v7
      with:
        name: notify-payload
        path: slack-payload.json
        retention-days: 1

  notify:
    name: Notify Deploy Result
    needs: prepare-notify
    if: needs.prepare-notify.outputs.should_deliver == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download Slack payload
      uses: actions/download-artifact@v8
      with:
        name: notify-payload

    - uses: ./.github/actions/notify
      with:
        slack_webhook: ${{ secrets.SLACK_WEBHOOK_PROD }}
