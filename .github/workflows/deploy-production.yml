name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch or tag)'
        required: false
        type: string
        default: main
      domain_name:
        description: 'Custom domain (optional; falls back to PRODUCTION_DOMAIN repository variable)'
        required: false
        type: string

# Prevent concurrent deployments to production
# Don't cancel running workflows to avoid partial Terraform deployments
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DO_TOKEN: ${{ secrets.DO_TOKEN }}

jobs:
  deploy:
    name: Deploy to Production
    permissions:
      contents: read
      packages: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: production
      deployment_id: production
      terraform_dir: terraform/production
      backend_key: production/production.tfstate
      image_tag: production
      slack_webhook_secret_name: SLACK_WEBHOOK_PRODUCTION
      vpc_name: production
      app_name: production
      migration_app_name: production-migrations
      db_name: production
      project_name: budget-prod
      post_pr_comments: false
      setup_auto_termination: false
      domain_name: ${{ inputs.domain_name || vars.PRODUCTION_DOMAIN }}
      git_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
    secrets:
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      TERRAFORM_AWS_S3_ACCESS_KEY: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY }}
      TERRAFORM_AWS_S3_ACCESS_KEY_SECRET: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY_SECRET }}
      TERRAFORM_AWS_S3_REGION: ${{ secrets.TERRAFORM_AWS_S3_REGION }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_PRODUCTION }}
