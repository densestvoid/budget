name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  go-checks:
    name: Run Go Checks
    uses: densestvoid/workflows/.github/workflows/go-checks.yml@main

  # Single required check for branch protection; succeeds only if go-checks does.
  ci:
    name: CI
    needs: [go-checks]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
