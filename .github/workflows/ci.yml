name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  go-build-key:
    name: Go build key
    runs-on: ubuntu-latest
    outputs:
      go_sources_changed: ${{ steps.key.outputs.go_sources_changed }}
      go_build_key: ${{ steps.key.outputs.go_build_key }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute Go build key
        id: key
        uses: ./.github/actions/go-build-key

  go-checks:
    name: Run Go Checks
    needs: go-build-key
    if: needs.go-build-key.outputs.go_sources_changed == 'true'
    uses: densestvoid/workflows/.github/workflows/go-checks.yml@main

  # Single required check for branch protection; succeeds when checks pass or are skipped.
  ci:
    name: CI
    needs: [go-build-key, go-checks]
    if: >-
      always() &&
      needs.go-build-key.result == 'success' &&
      (needs.go-checks.result == 'success' || needs.go-checks.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        run: |
          if [ "${{ needs.go-build-key.outputs.go_sources_changed }}" = "true" ]; then
            echo "Go sources changed in this push — go-checks ran"
          else
            echo "Go sources unchanged in this push (key=${{ needs.go-build-key.outputs.go_build_key }}) — skipped go-checks"
          fi
          echo "All checks passed"
