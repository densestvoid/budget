name: Deploy PR

run-name: pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number }}

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy'
        required: true
        type: string
      ref:
        description: 'Git ref to deploy from (optional; defaults to the workflow branch for manual runs)'
        required: false
        type: string
      force_cleanup:
        description: 'Destroy existing PR deployment before redeploying (use when prior deployment was not terminated)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  DO_TOKEN: ${{ secrets.DO_TOKEN }}

jobs:
  check-deploy-needed:
    name: Check Deploy Requirements
    runs-on: ubuntu-latest
    # Manual dispatch always allowed. Auto deploy only for same-repo PRs (not forks).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_branch != 'main' &&
       (github.event.workflow_run.head_repository == null ||
        github.event.workflow_run.head_repository.full_name == github.repository) &&
       github.event.workflow_run.pull_requests[0].number != '')
    outputs:
      should_deploy: ${{ steps.manual.outputs.should_deploy || steps.gate.outputs.should_deploy }}
      changed_files: ${{ steps.manual.outputs.changed_files || steps.gate.outputs.changed_files }}
      compare_base: ${{ steps.manual.outputs.compare_base || steps.gate.outputs.compare_base }}
    steps:
    - name: Manual deploy — always proceed
      if: github.event_name == 'workflow_dispatch'
      id: manual
      run: |
        echo "Manual workflow_dispatch — deploy gate bypassed"
        echo "should_deploy=true" >> "$GITHUB_OUTPUT"
        echo "changed_files=" >> "$GITHUB_OUTPUT"
        echo "compare_base=" >> "$GITHUB_OUTPUT"

    - name: Checkout PR head
      if: github.event_name == 'workflow_run'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0

    - name: Check branch for deployable changes
      if: github.event_name == 'workflow_run'
      id: gate
      run: |
        set -euo pipefail

        is_deployable_path() {
          case "$1" in
            *.go|go.mod|go.sum) return 0 ;;
            data/migrations/*) return 0 ;;
            Dockerfile|.dockerignore) return 0 ;;
            Dockerfile.*) return 0 ;;
            terraform/*) return 0 ;;
            *) return 1 ;;
          esac
        }

        git fetch origin main

        if ! COMPARE_BASE=$(git merge-base HEAD origin/main); then
          echo "Could not resolve merge-base with origin/main — defaulting to deploy"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "changed_files=" >> "$GITHUB_OUTPUT"
          echo "compare_base=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Compare base (merge-base with main): ${COMPARE_BASE}"
        echo "compare_base=${COMPARE_BASE}" >> "$GITHUB_OUTPUT"

        DEPLOYABLE_FILES=()
        while IFS= read -r file; do
          [ -z "$file" ] && continue
          if is_deployable_path "$file"; then
            DEPLOYABLE_FILES+=("$file")
          fi
        done < <(git diff --name-only "$COMPARE_BASE" HEAD)

        if [ "${#DEPLOYABLE_FILES[@]}" -gt 0 ]; then
          echo "Deployable changes found on branch:"
          printf '  - %s\n' "${DEPLOYABLE_FILES[@]}"
          CHANGED=$(IFS=,; echo "${DEPLOYABLE_FILES[*]}")
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "changed_files=${CHANGED}" >> "$GITHUB_OUTPUT"
        else
          echo "No deployable changes relative to main — skipping PR deploy"
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          echo "changed_files=" >> "$GITHUB_OUTPUT"
        fi

  deploy:
    name: Deploy to DigitalOcean
    needs: check-deploy-needed
    if: needs.check-deploy-needed.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: pr
      deployment_id: pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number }}
      terraform_dir: terraform/pr
      backend_key: pr/pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number }}.tfstate
      image_tag: pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number }}
      vpc_name: pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number }}
      app_name: pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number }}
      migration_app_name: pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number }}-migrations
      db_name: pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number }}
      project_name: budget-develop
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number }}
      domain_name: ${{ vars.PRODUCTION_DOMAIN }}
      git_ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.ref || '' }}
      force_cleanup: ${{ github.event.inputs.force_cleanup == true }}
    secrets:
      DO_TOKEN: ${{ secrets.DO_TOKEN }}
      TERRAFORM_AWS_S3_ACCESS_KEY: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY }}
      TERRAFORM_AWS_S3_ACCESS_KEY_SECRET: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY_SECRET }}
      TERRAFORM_AWS_S3_REGION: ${{ secrets.TERRAFORM_AWS_S3_REGION }}

  publish-skip-result:
    name: Publish Skip Result
    needs: check-deploy-needed
    if: |
      needs.check-deploy-needed.outputs.should_deploy != 'true' &&
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
    - name: Build deploy-result.json
      env:
        PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        DEPLOYMENT_ID: pr-${{ github.event.workflow_run.pull_requests[0].number }}
        GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        CHANGED_FILES: ${{ needs.check-deploy-needed.outputs.changed_files }}
        COMPARE_BASE: ${{ needs.check-deploy-needed.outputs.compare_base }}
      run: |
        cat > deploy-result.json << EOF
        {
          "environment": "pr",
          "deployment_id": "${DEPLOYMENT_ID}",
          "pr_number": "${PR_NUMBER}",
          "deployment_success": false,
          "skipped": true,
          "skip_reason": "no_deployable_changes",
          "changed_deployable_files": "${CHANGED_FILES}",
          "compare_base": "${COMPARE_BASE}",
          "app_url": "",
          "app_id": "",
          "migration_app_id": "",
          "image_tag": "",
          "git_sha": "${GIT_SHA}",
          "termination_time": "",
          "termination_delay_minutes": "",
          "jobs": {
            "pre_cleanup": "skipped",
            "check_builds": "skipped",
            "build_go": "skipped",
            "build_docker": "skipped",
            "deploy": "skipped"
          }
        }
        EOF

        echo "Deploy skipped — no deployable branch changes:"
        cat deploy-result.json

    - name: Upload deploy-result artifact
      uses: actions/upload-artifact@v7
      with:
        name: deploy-result
        path: deploy-result.json
        retention-days: 7

  prepare-notify-deploy:
    name: Prepare Deploy Notification
    needs: deploy
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    outputs:
      should_deliver: ${{ steps.message.outputs.should_deliver }}
      pr_number: ${{ steps.message.outputs.pr_number }}
      pr_body: ${{ steps.message.outputs.pr_body }}
    steps:
    - name: Download deploy-result artifact
      uses: actions/download-artifact@v8
      with:
        name: deploy-result

    - name: Build PR deploy notification
      id: message
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_PR }}
      run: |
        set -euo pipefail
        if [ ! -f deploy-result.json ]; then
          echo "No deploy-result artifact — deploy did not run"
          echo "should_deliver=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        DEPLOYMENT_ID=$(jq -r '.deployment_id' deploy-result.json)
        PR_NUMBER=$(jq -r '.pr_number // empty' deploy-result.json)
        DEPLOYMENT_SUCCESS=$(jq -r '.deployment_success' deploy-result.json)
        APP_URL=$(jq -r '.app_url // empty' deploy-result.json)
        APP_ID=$(jq -r '.app_id // empty' deploy-result.json)
        MIGRATION_APP_ID=$(jq -r '.migration_app_id // empty' deploy-result.json)
        CHECK_BUILDS=$(jq -r '.jobs.check_builds' deploy-result.json)
        BUILD_GO=$(jq -r '.jobs.build_go' deploy-result.json)
        BUILD_DOCKER=$(jq -r '.jobs.build_docker' deploy-result.json)
        DEPLOY_JOB=$(jq -r '.jobs.deploy' deploy-result.json)
        TERMINATION_TIME=$(jq -r '.termination_time // empty' deploy-result.json)
        TERMINATION_DELAY=$(jq -r '.termination_delay_minutes // empty' deploy-result.json)
        SKIPPED=$(jq -r '.skipped // false' deploy-result.json)

        if [ "$SKIPPED" = "true" ]; then
          echo "Skipped deploy — handled by notify-skip job"
          echo "should_deliver=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$DEPLOYMENT_SUCCESS" = "true" ] && [ "$DEPLOY_JOB" = "success" ]; then
          if [ -n "$TERMINATION_TIME" ]; then
            AUTO_TERM_LINE="**Auto-termination:** ${TERMINATION_TIME} UTC (${TERMINATION_DELAY:-?} min after deploy)"
            TERM_SLACK="${TERMINATION_TIME} UTC"
            if [ -n "$TERMINATION_DELAY" ]; then
              TERM_SLACK="${TERM_SLACK} (${TERMINATION_DELAY} min)"
            fi
          else
            AUTO_TERM_LINE="**Auto-termination:** Scheduled via the \`termination-delay\` environment wait timer"
            TERM_SLACK="termination-delay wait timer"
          fi
          PR_BODY="## ✅ Deployment Successful

        **URL:** ${APP_URL:-N/A}
        **App ID:** ${APP_ID:-N/A}
        **Migration ID:** ${MIGRATION_APP_ID:-N/A}
        **Deployment:** ${DEPLOYMENT_ID}
        ${AUTO_TERM_LINE}"
          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg deployment "$DEPLOYMENT_ID" \
            --arg url "$APP_URL" \
            --arg app "$APP_ID" \
            --arg run "$RUN_URL" \
            --arg term "$TERM_SLACK" \
            '{
              text: "✅ PR Deployment Successful",
              attachments: [{
                color: "good",
                fields: [
                  {title: "PR Number", value: $pr, short: true},
                  {title: "Deployment ID", value: $deployment, short: true},
                  {title: "Application URL", value: $url, short: false},
                  {title: "App ID", value: $app, short: true},
                  {title: "Terminates (UTC)", value: $term, short: true},
                  {title: "Workflow Run", value: $run, short: false}
                ]
              }]
            }' > slack-payload.json
        else
          FAILED_STEP="Unknown"
          ERROR_MESSAGE="Workflow execution failed"
          if [ "$CHECK_BUILDS" = "failure" ]; then
            FAILED_STEP="Check build requirements"
            ERROR_MESSAGE="Build requirement analysis failed."
          elif [ "$BUILD_GO" = "failure" ]; then
            FAILED_STEP="Build Go binary"
            ERROR_MESSAGE="Go binary build failed."
          elif [ "$BUILD_DOCKER" = "failure" ]; then
            FAILED_STEP="Build Docker image"
            ERROR_MESSAGE="Docker image build or push failed."
          elif [ "$DEPLOY_JOB" = "failure" ]; then
            FAILED_STEP="Deploy infrastructure"
            ERROR_MESSAGE="Terraform deployment failed."
          elif [ "$DEPLOY_JOB" = "skipped" ]; then
            FAILED_STEP="Deploy skipped"
            ERROR_MESSAGE="Deploy was skipped because an earlier job failed."
          fi

          CLEANUP_LINE=""
          if [ "$DEPLOY_JOB" = "failure" ]; then
            CLEANUP_LINE="**Cleanup:** Termination workflow will attempt to clean up partial resources"
          fi
          PR_BODY="## ❌ Deployment Failed

        **Workflow:** Deploy PR
        **Step:** ${FAILED_STEP}
        **Error:**
        \`\`\`
        ${ERROR_MESSAGE}
        \`\`\`
        ${CLEANUP_LINE}"
          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg deployment "$DEPLOYMENT_ID" \
            --arg step "$FAILED_STEP" \
            --arg error "$ERROR_MESSAGE" \
            --arg run "$RUN_URL" \
            '{
              text: "❌ PR Deployment Failed",
              attachments: [{
                color: "danger",
                fields: [
                  {title: "PR Number", value: $pr, short: true},
                  {title: "Deployment ID", value: $deployment, short: true},
                  {title: "Failed Step", value: $step, short: true},
                  {title: "Error", value: $error, short: false},
                  {title: "Workflow Run", value: $run, short: false}
                ]
              }]
            }' > slack-payload.json
        fi

        echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        {
          echo "pr_body<<EOF"
          echo "$PR_BODY"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        SHOULD_DELIVER=false
        if [ -n "$SLACK_WEBHOOK" ] && [ -f slack-payload.json ]; then
          SHOULD_DELIVER=true
        fi
        if [ -n "$PR_NUMBER" ] && [ -n "$PR_BODY" ]; then
          SHOULD_DELIVER=true
        fi
        echo "should_deliver=${SHOULD_DELIVER}" >> "$GITHUB_OUTPUT"

    - name: Upload Slack payload
      if: steps.message.outputs.should_deliver == 'true' && hashFiles('slack-payload.json') != ''
      uses: actions/upload-artifact@v7
      with:
        name: notify-payload
        path: slack-payload.json
        retention-days: 1

  notify-deploy:
    name: Notify Deploy Result
    needs: prepare-notify-deploy
    if: needs.prepare-notify-deploy.outputs.should_deliver == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download Slack payload
      uses: actions/download-artifact@v8
      with:
        name: notify-payload
      continue-on-error: true

    - uses: ./.github/actions/notify
      with:
        slack_webhook: ${{ secrets.SLACK_WEBHOOK_PR }}
        pr_number: ${{ needs.prepare-notify-deploy.outputs.pr_number }}
        pr_body: ${{ needs.prepare-notify-deploy.outputs.pr_body }}

  prepare-notify-skip:
    name: Prepare Deploy Skip Notification
    needs: publish-skip-result
    if: needs.publish-skip-result.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_deliver: ${{ steps.message.outputs.should_deliver }}
      pr_number: ${{ steps.message.outputs.pr_number }}
      pr_body: ${{ steps.message.outputs.pr_body }}
    steps:
    - name: Download deploy-result artifact
      uses: actions/download-artifact@v8
      with:
        name: deploy-result

    - name: Build PR deploy skip notification
      id: message
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_PR }}
      run: |
        set -euo pipefail
        if [ ! -f deploy-result.json ]; then
          echo "No deploy-result artifact"
          echo "should_deliver=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        DEPLOYMENT_ID=$(jq -r '.deployment_id' deploy-result.json)
        PR_NUMBER=$(jq -r '.pr_number // empty' deploy-result.json)
        SKIP_REASON=$(jq -r '.skip_reason // empty' deploy-result.json)
        CHANGED_DEPLOYABLE=$(jq -r '.changed_deployable_files // empty' deploy-result.json)
        SKIPPED=$(jq -r '.skipped // false' deploy-result.json)

        if [ "$SKIPPED" != "true" ]; then
          echo "Not a skip result"
          echo "should_deliver=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        PR_BODY="## ℹ️ PR Deploy Skipped

        This branch has no Go, Docker, or Terraform changes relative to \`main\`. No PR environment will be created.

        **Deployment:** ${DEPLOYMENT_ID}
        **Reason:** ${SKIP_REASON:-no_deployable_changes}"

        CHANGED_SUMMARY="${CHANGED_DEPLOYABLE:-none}"
        jq -n \
          --arg pr "$PR_NUMBER" \
          --arg deployment "$DEPLOYMENT_ID" \
          --arg reason "${SKIP_REASON:-no_deployable_changes}" \
          --arg changed "$CHANGED_SUMMARY" \
          --arg run "$RUN_URL" \
          '{
            text: "ℹ️ PR Deploy Skipped",
            attachments: [{
              color: "warning",
              fields: [
                {title: "PR Number", value: $pr, short: true},
                {title: "Deployment ID", value: $deployment, short: true},
                {title: "Reason", value: $reason, short: true},
                {title: "Deployable files changed", value: $changed, short: false},
                {title: "Workflow Run", value: $run, short: false}
              ]
            }]
          }' > slack-payload.json

        echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        {
          echo "pr_body<<EOF"
          echo "$PR_BODY"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        SHOULD_DELIVER=false
        if [ -n "$SLACK_WEBHOOK" ] && [ -f slack-payload.json ]; then
          SHOULD_DELIVER=true
        fi
        if [ -n "$PR_NUMBER" ] && [ -n "$PR_BODY" ]; then
          SHOULD_DELIVER=true
        fi
        echo "should_deliver=${SHOULD_DELIVER}" >> "$GITHUB_OUTPUT"

    - name: Upload Slack payload
      if: steps.message.outputs.should_deliver == 'true' && hashFiles('slack-payload.json') != ''
      uses: actions/upload-artifact@v7
      with:
        name: notify-payload
        path: slack-payload.json
        retention-days: 1

  notify-skip:
    name: Notify Deploy Skip
    needs: prepare-notify-skip
    if: needs.prepare-notify-skip.outputs.should_deliver == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download Slack payload
      uses: actions/download-artifact@v8
      with:
        name: notify-payload
      continue-on-error: true

    - uses: ./.github/actions/notify
      with:
        slack_webhook: ${{ secrets.SLACK_WEBHOOK_PR }}
        pr_number: ${{ needs.prepare-notify-skip.outputs.pr_number }}
        pr_body: ${{ needs.prepare-notify-skip.outputs.pr_body }}
