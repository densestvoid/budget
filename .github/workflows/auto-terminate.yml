name: Auto-Terminate Deployment

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to terminate'
        required: true
        type: string
      deployment_id:
        description: 'Deployment ID (leave empty to auto-generate from PR)'
        required: false
        type: string
      app_id:
        description: 'DigitalOcean App ID (leave empty to auto-detect)'
        required: false
        type: string
      migration_app_id:
        description: 'Migration App ID (leave empty to auto-detect)'
        required: false
        type: string
      app_url:
        description: 'Application URL (leave empty to auto-detect)'
        required: false
        type: string
      termination_delay_minutes:
        description: 'Wait timer duration in minutes (must match termination-delay environment and TERMINATION_DELAY_MINUTES variable)'
        required: false
        type: string
        default: '30'
      skip_environment_wait:
        description: 'Skip the termination-delay wait timer (immediate termination for manual cleanup)'
        required: false
        type: boolean
        default: false

# Prevent multiple auto-terminate workflows for the same PR
# Cancel previous terminations since destroy operations are idempotent
concurrency:
  group: auto-terminate-pr-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

env:
  DO_TOKEN: ${{ secrets.DO_TOKEN }}

jobs:
  auto-terminate:
    runs-on: ubuntu-latest
    
    # Permissions for commenting on PRs
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    # Wait timer duration must match TERMINATION_DELAY_MINUTES (skipped when skip_environment_wait is true)
    environment: ${{ github.event.inputs.skip_environment_wait != 'true' && 'termination-delay' || '' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.7
    
    - name: Validate termination inputs
      id: validate
      run: |
        APP_ID="${{ github.event.inputs.app_id }}"
        APP_URL="${{ github.event.inputs.app_url }}"
        PR_NUMBER="${{ github.event.inputs.pr_number }}"
        DEPLOYMENT_ID="${{ github.event.inputs.deployment_id }}"
        
        echo "🗑️ Auto-termination workflow started"
        echo "Deployment ID: $DEPLOYMENT_ID"
        echo "App ID: $APP_ID"
        echo "App URL: $APP_URL" 
        echo "PR Number: #$PR_NUMBER"
        echo "Skip environment wait: ${{ github.event.inputs.skip_environment_wait }}"
        echo "Triggered at: $(date -u)"
        
        # Validate required inputs
        if [ -z "$APP_ID" ] || [ -z "$APP_URL" ] || [ -z "$PR_NUMBER" ] || [ -z "$DEPLOYMENT_ID" ]; then
          echo "❌ Error: Missing required inputs"
          exit 1
        fi
        
        echo "✅ Inputs validated"
        echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
        echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
        echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
    
    - name: Check app health before termination
      id: health_check
      run: |
        APP_URL="${{ steps.validate.outputs.app_url }}"
        
        echo "🩺 Checking app health before termination..."
        
        # Test if app is still responding
        if curl -f --connect-timeout 10 --max-time 15 "$APP_URL/health" >/dev/null 2>&1; then
          echo "✅ App is healthy and responding"
          echo "should_terminate=true" >> $GITHUB_OUTPUT
          echo "health_status=healthy" >> $GITHUB_OUTPUT
        else
          echo "❌ App is not responding"
          echo "should_terminate=maybe" >> $GITHUB_OUTPUT
          echo "health_status=unhealthy" >> $GITHUB_OUTPUT
          
          # Check if app still exists via DO API
          APP_ID="${{ steps.validate.outputs.app_id }}"
          echo "Checking if app still exists via DigitalOcean API..."
          
          response=$(curl -s -H "Authorization: Bearer ${{ env.DO_TOKEN }}" \
            "https://api.digitalocean.com/v2/apps/$APP_ID")
          
          if echo "$response" | jq -e '.app' >/dev/null 2>&1; then
            app_phase=$(echo "$response" | jq -r '.app.phase')
            echo "ℹ️  App exists in DigitalOcean (phase: $app_phase) but not responding"
            echo "Will attempt termination anyway"
            echo "should_terminate=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  App no longer exists in DigitalOcean - already terminated"
            echo "should_terminate=false" >> $GITHUB_OUTPUT
          fi
        fi
    
    - name: Setup Terraform configuration for destroy
      id: setup
      run: |
        echo "🔧 Setting up Terraform configuration for destroy..."
        
        DEPLOYMENT_ID="${{ steps.validate.outputs.deployment_id }}"
        
        # Determine terraform directory based on deployment ID
        if [[ "$DEPLOYMENT_ID" == pr-* ]]; then
          TERRAFORM_DIR="terraform/pr"
        else
          TERRAFORM_DIR="terraform/production"
        fi
        
        echo "Using Terraform directory: $TERRAFORM_DIR"
        cd "$TERRAFORM_DIR"
        
        # Create terraform.tfvars for destroy operation
        cat > terraform.tfvars << EOF
        do_token = "${{ env.DO_TOKEN }}"
        region = "nyc1"
        deployment_id = "$DEPLOYMENT_ID"
        github_repo = "${{ github.repository }}"
        docker_image_tag = "$DEPLOYMENT_ID"
        github_token = "${{ secrets.GITHUB_TOKEN }}"
        auto_terminate_minutes = 30
        EOF
        
        echo "✅ Terraform configuration created for deployment: $DEPLOYMENT_ID"
        echo "terraform_dir=$TERRAFORM_DIR" >> $GITHUB_OUTPUT
        echo "setup_success=true" >> $GITHUB_OUTPUT
    
    - name: Initialize Terraform with AWS S3 backend
      id: init
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY_SECRET }}
        AWS_REGION: ${{ secrets.TERRAFORM_AWS_S3_REGION }}
      run: |
        DEPLOYMENT_ID="${{ steps.validate.outputs.deployment_id }}"
        
        # Determine terraform directory based on deployment ID
        if [[ "$DEPLOYMENT_ID" == pr-* ]]; then
          TERRAFORM_DIR="terraform/pr"
        else
          TERRAFORM_DIR="terraform/production"
        fi
        
        echo "Using Terraform directory: $TERRAFORM_DIR"
        cd "$TERRAFORM_DIR"
        
        echo "🔧 Initializing Terraform with AWS S3 backend..."
        echo "Deployment ID: ${{ steps.validate.outputs.deployment_id }}"
        
        # Determine backend key based on deployment type
        if [[ "$DEPLOYMENT_ID" == pr-* ]]; then
          BACKEND_KEY="pr/$DEPLOYMENT_ID.tfstate"
        else
          BACKEND_KEY="production/$DEPLOYMENT_ID.tfstate"
        fi
        
        echo "Backend key: $BACKEND_KEY"
        
        # Set AWS region from secret
        AWS_REGION="${{ secrets.TERRAFORM_AWS_S3_REGION }}"
        echo "AWS Region: '$AWS_REGION'"
        
        # Initialize with deployment-specific state file
        if terraform init -backend-config="key=$BACKEND_KEY" -backend-config="region=$AWS_REGION"; then
          echo "✅ Terraform initialized successfully"
          echo "init_success=true" >> $GITHUB_OUTPUT
          
          # Check if deployment still exists
          echo "📋 Resources in state:"
          RESOURCE_COUNT=$(terraform state list | wc -l)
          terraform state list || echo "No resources in state"
          
          if [ "$RESOURCE_COUNT" -eq 0 ]; then
            echo "ℹ️ No resources found - deployment already terminated"
            echo "already_terminated=true" >> $GITHUB_OUTPUT
          else
            echo "🎯 Found $RESOURCE_COUNT resources - proceeding with termination"
            echo "already_terminated=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "❌ Terraform initialization failed"
          echo "init_success=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    # State file contains the deployment state automatically via DigitalOcean Spaces backend
    
    - name: Destroy deployment
      if: steps.health_check.outputs.should_terminate == 'true' && steps.init.outputs.init_success == 'true' && steps.init.outputs.already_terminated == 'false'
      id: destroy
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY_SECRET }}
        AWS_REGION: ${{ secrets.TERRAFORM_AWS_S3_REGION }}
      run: |
        DEPLOYMENT_ID="${{ steps.validate.outputs.deployment_id }}"
        
        echo "🗑️ Destroying deployment: $DEPLOYMENT_ID"
        echo "Termination time: $(date -u)"
        echo "Note: Shared project 'budget-develop' will be preserved"
        
        # Use the same terraform directory from setup step
        TERRAFORM_DIR="${{ steps.setup.outputs.terraform_dir }}"
        echo "Using Terraform directory: $TERRAFORM_DIR"
        cd "$TERRAFORM_DIR"
        
        # Show what will be destroyed
        echo "📋 Resources in state:"
        terraform state list
        
        # Run terraform destroy
        echo "🗑️ Executing terraform destroy..."
        if terraform destroy -auto-approve; then
          echo "✅ Deployment destroyed successfully"
          echo "🧹 All resources cleaned up"
          echo "destroy_success=true" >> $GITHUB_OUTPUT
          
          # Remove state file from AWS S3 bucket
          echo "🗑️ Removing state file from AWS S3..."
          
          # Determine backend key based on deployment type
          if [[ "$DEPLOYMENT_ID" == pr-* ]]; then
            STATE_FILE_KEY="pr/$DEPLOYMENT_ID.tfstate"
          else
            STATE_FILE_KEY="production/$DEPLOYMENT_ID.tfstate"
          fi
          
          echo "Removing state file: $STATE_FILE_KEY"
          
          # Use AWS CLI to remove state file (AWS CLI is pre-installed in GitHub Actions)
          if aws s3 rm "s3://densestvoid-terraform/$STATE_FILE_KEY"; then
            echo "✅ State file removed from AWS S3"
          else
            echo "⚠️ Failed to remove state file (may not exist or already deleted)"
          fi
        else
          echo "❌ Terraform destroy failed"
          echo "destroy_success=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    - name: Comment on PR with termination result
      # Only comment if we actually attempted termination (not already terminated)
      if: steps.init.outputs.already_terminated == 'false'
      uses: actions/github-script@v7
      with:
        script: |
          const deploymentId = '${{ steps.validate.outputs.deployment_id }}';
          const shouldTerminate = '${{ steps.health_check.outputs.should_terminate }}';
          const destroySuccess = '${{ steps.destroy.outputs.destroy_success }}';
          const setupSuccess = '${{ steps.setup.outputs.setup_success }}';
          const initSuccess = '${{ steps.init.outputs.init_success }}';
          const alreadyTerminated = '${{ steps.init.outputs.already_terminated }}';
          // State managed automatically via DigitalOcean Spaces backend
          const prNumber = '${{ steps.validate.outputs.pr_number }}';
          
          let message;
          
          if (shouldTerminate === 'false') {
            message = `## ✅ Auto-Termination Completed\n\n**🆔 ID:** ${deploymentId}\n**Result:** Already terminated`;
          } else if (destroySuccess === 'true') {
            message = `## ✅ Auto-Termination Completed\n\n**🆔 ID:** ${deploymentId}\n**Result:** Successfully destroyed`;
          } else {
            // Determine which step failed for error message
            let failedStep = 'Unknown';
            let errorMsg = 'Unknown error occurred';
            
            if (setupSuccess !== 'true') {
              failedStep = 'Setup Terraform configuration';
              errorMsg = 'Failed to create terraform.tfvars';
            } else if (initSuccess !== 'true') {
              failedStep = 'Initialize Terraform';
              errorMsg = 'terraform init failed';
            } else {
              failedStep = 'Destroy deployment';
              errorMsg = 'terraform destroy failed - some resources may still exist';
            }
            
            message = `## ❌ Auto-Termination Failed\n\n**Workflow:** Auto-Terminate Deployment\n**Step:** ${failedStep}\n**Error:**\n\`\`\`\n${errorMsg}\n\`\`\`\n**Cleanup:** Manual cleanup may be required`;
          }
          
          github.rest.issues.createComment({
            issue_number: parseInt(prNumber),
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });
    
    - name: Send termination notification to Slack
      if: always() && steps.validate.outputs.pr_number != ''
      continue-on-error: true
      uses: slackapi/slack-github-action@v2.1.1
      with:
        webhook-type: incoming-webhook
        webhook: ${{ secrets.SLACK_WEBHOOK_PR }}
        payload: |
          {
            "text": "${{ steps.init.outputs.already_terminated == 'true' && 'ℹ️ PR Deployment Already Terminated' || steps.destroy.outputs.destroy_success == 'true' && '✅ PR Deployment Auto-Terminated' || '❌ PR Deployment Termination Failed' }}",
            "attachments": [
              {
                "color": "${{ steps.init.outputs.already_terminated == 'true' && 'warning' || steps.destroy.outputs.destroy_success == 'true' && 'good' || 'danger' }}",
                "fields": [
                  {
                    "title": "PR Number",
                    "value": "${{ steps.validate.outputs.pr_number }}",
                    "short": true
                  },
                  {
                    "title": "Deployment ID",
                    "value": "${{ steps.validate.outputs.deployment_id }}",
                    "short": true
                  },
                  {
                    "title": "App URL",
                    "value": "${{ steps.validate.outputs.app_url }}",
                    "short": true
                  },
                  {
                    "title": "Status",
                    "value": "${{ steps.init.outputs.already_terminated == 'true' && 'Already terminated' || steps.destroy.outputs.destroy_success == 'true' && 'Successfully destroyed' || 'Termination failed' }}",
                    "short": true
                  }
                ]
              }
            ]
          }
    
    - name: Update workflow summary
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const delayFromInput = '${{ github.event.inputs.termination_delay_minutes }}'.trim();
          const delayFromVar = '${{ vars.TERMINATION_DELAY_MINUTES }}'.trim();
          let delayMinutes = delayFromInput || delayFromVar;
          
          if (!delayMinutes) {
            try {
              const { data } = await github.rest.repos.getEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: 'termination-delay'
              });
              const waitRule = data.protection_rules?.find(rule => rule.type === 'wait_timer');
              delayMinutes = String(waitRule?.wait_timer ?? 30);
            } catch (error) {
              delayMinutes = '30';
            }
          }
          
          core.summary.addHeading('🗑️ Auto-Termination Results');
          core.summary.addRaw(`**App ID:** ${{ steps.validate.outputs.app_id }}\n`);
          core.summary.addRaw(`**Health Status:** ${{ steps.health_check.outputs.health_status }}\n`);
          core.summary.addRaw(`**Should Terminate:** ${{ steps.health_check.outputs.should_terminate }}\n`);
          core.summary.addRaw(`**Termination Result:** ${{ steps.destroy.outputs.destroy_success }}\n`);
          core.summary.addRaw(`**Completed At:** ${new Date().toISOString()}\n\n`);
          core.summary.addRaw(`*Environment wait timer (${delayMinutes} minutes) prevented runner time waste during the delay*`);
          await core.summary.write();