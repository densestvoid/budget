name: Terminate PR Deployment

run-name: ${{ github.event_name == 'workflow_dispatch' && format('pr-{0}', github.event.inputs.pr_number) || github.event.workflow_run.name }}

on:
  workflow_run:
    workflows:
      - Deploy PR
    types:
      - completed
    # No branches filter: workflow_run head_branch is always the default branch (main)
    # for downstream listeners. branches-ignore: main would block every auto-trigger.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to terminate or cleanup'
        required: true
        type: string
      skip_environment_wait:
        description: 'Skip the termination-delay wait timer (immediate termination)'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('terminate-pr-{0}', github.event.inputs.pr_number) || format('terminate-{0}', github.event.workflow_run.name) }}
  cancel-in-progress: true

env:
  DO_TOKEN: ${{ secrets.DO_TOKEN }}

jobs:
  resolve:
    name: Resolve Termination Context
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      reason: ${{ steps.resolve.outputs.reason }}
      use_wait_timer: ${{ steps.resolve.outputs.use_wait_timer }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      deployment_id: ${{ steps.resolve.outputs.deployment_id }}

    steps:
    - name: Download deploy-result artifact
      if: github.event_name == 'workflow_run'
      uses: actions/download-artifact@v8
      with:
        name: deploy-result
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
      continue-on-error: true

    - name: Resolve context
      id: resolve
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          PR_NUMBER="${{ github.event.inputs.pr_number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "PR number is required"
            exit 1
          fi
          USE_WAIT=$([ "${{ github.event.inputs.skip_environment_wait }}" = "true" ] && echo false || echo true)
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=manual" >> "$GITHUB_OUTPUT"
          echo "use_wait_timer=${USE_WAIT}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "deployment_id=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ ! -f deploy-result.json ]; then
          echo "No deploy-result artifact — deploy did not run"
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        PR_NUMBER=$(jq -r '.pr_number // empty' deploy-result.json)
        DEPLOYMENT_ID=$(jq -r '.deployment_id // empty' deploy-result.json)
        DEPLOYMENT_SUCCESS=$(jq -r '.deployment_success' deploy-result.json)
        DEPLOY_JOB=$(jq -r '.jobs.deploy // empty' deploy-result.json)

        if [ -z "$PR_NUMBER" ] || [ -z "$DEPLOYMENT_ID" ]; then
          echo "deploy-result missing pr_number or deployment_id"
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$DEPLOY_JOB" = "skipped" ]; then
          echo "Deploy job was skipped — nothing to terminate"
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$DEPLOYMENT_SUCCESS" = "true" ]; then
          echo "reason=scheduled" >> "$GITHUB_OUTPUT"
          echo "use_wait_timer=true" >> "$GITHUB_OUTPUT"
        else
          echo "reason=failure_cleanup" >> "$GITHUB_OUTPUT"
          echo "use_wait_timer=false" >> "$GITHUB_OUTPUT"
        fi

        echo "should_run=true" >> "$GITHUB_OUTPUT"
        echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"

  terminate:
    name: Terminate PR Deployment
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ needs.resolve.outputs.use_wait_timer == 'true' && 'termination-delay' || '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.5.7
        terraform_wrapper: false

    - name: Load state and prepare destroy
      id: init
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY_SECRET }}
        AWS_REGION: ${{ secrets.TERRAFORM_AWS_S3_REGION }}
      run: |
        set -eu -o pipefail
        DEPLOYMENT_ID="${{ needs.resolve.outputs.deployment_id }}"
        BACKEND_KEY="pr/${DEPLOYMENT_ID}.tfstate"

        cd terraform/pr-destroy

        cat > terraform.tfvars <<EOF
        do_token = "${{ env.DO_TOKEN }}"
        EOF

        if terraform init -backend-config="key=${BACKEND_KEY}" -backend-config="region=${AWS_REGION}"; then
          echo "init_success=true" >> "$GITHUB_OUTPUT"
        else
          echo "init_success=false" >> "$GITHUB_OUTPUT"
          echo "state_resource_count=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        RESOURCE_COUNT=$(terraform state list 2>/dev/null | wc -l | tr -d ' ')
        echo "state_resource_count=${RESOURCE_COUNT}" >> "$GITHUB_OUTPUT"
        echo "Resources in S3 state (${RESOURCE_COUNT}):"
        terraform state list 2>/dev/null || true

        if [ "$RESOURCE_COUNT" -eq 0 ]; then
          echo "already_terminated=true" >> "$GITHUB_OUTPUT"
        else
          echo "already_terminated=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Destroy from state
      id: destroy
      if: |
        steps.init.outputs.init_success == 'true' &&
        steps.init.outputs.already_terminated == 'false'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_AWS_S3_ACCESS_KEY_SECRET }}
        AWS_REGION: ${{ secrets.TERRAFORM_AWS_S3_REGION }}
      run: |
        set -eu -o pipefail
        DEPLOYMENT_ID="${{ needs.resolve.outputs.deployment_id }}"
        cd terraform/pr-destroy

        DESTROY_LOG=$(mktemp)
        # No resource blocks in pr-destroy: state entries are config orphans.
        # terraform destroy only targets configured resources (none here), so apply is required.
        if terraform apply -auto-approve 2>&1 | tee "$DESTROY_LOG"; then
          echo "destroy_success=true" >> "$GITHUB_OUTPUT"
          aws s3 rm "s3://densestvoid-terraform/pr/${DEPLOYMENT_ID}.tfstate" || true
        else
          echo "destroy_success=false" >> "$GITHUB_OUTPUT"
          tail -30 "$DESTROY_LOG" > "${GITHUB_WORKSPACE}/destroy-error.txt"
          echo "State teardown failed — S3 state retained for retry"
        fi

    - name: Publish terminate result
      if: always()
      run: |
        INIT_SUCCESS="${{ steps.init.outputs.init_success }}"
        [ -z "$INIT_SUCCESS" ] && INIT_SUCCESS="false"
        DESTROY_SUCCESS="${{ steps.destroy.outputs.destroy_success }}"
        [ -z "$DESTROY_SUCCESS" ] && DESTROY_SUCCESS="false"
        ALREADY="${{ steps.init.outputs.already_terminated }}"
        [ -z "$ALREADY" ] && ALREADY="false"

        STATE_COUNT="${{ steps.init.outputs.state_resource_count }}"
        [ -z "$STATE_COUNT" ] && STATE_COUNT="0"

        # Skip notification only when state loaded and is empty.
        if [ "$INIT_SUCCESS" = "true" ] && [ "$ALREADY" = "true" ]; then
          SKIPPED_JSON=true
        else
          SKIPPED_JSON=false
        fi
        [ "$INIT_SUCCESS" = "true" ] && IS_JSON=true || IS_JSON=false
        [ "$DESTROY_SUCCESS" = "true" ] && DS_JSON=true || DS_JSON=false
        [ "$ALREADY" = "true" ] && AT_JSON=true || AT_JSON=false

        DESTROY_ERROR=""
        if [ -f "${GITHUB_WORKSPACE}/destroy-error.txt" ]; then
          DESTROY_ERROR=$(cat "${GITHUB_WORKSPACE}/destroy-error.txt")
        fi

        jq -n \
          --arg pr_number "${{ needs.resolve.outputs.pr_number }}" \
          --arg deployment_id "${{ needs.resolve.outputs.deployment_id }}" \
          --arg reason "${{ needs.resolve.outputs.reason }}" \
          --arg destroy_error "$DESTROY_ERROR" \
          --argjson state_resource_count "$STATE_COUNT" \
          --argjson init_success "$IS_JSON" \
          --argjson destroy_success "$DS_JSON" \
          --argjson already_terminated "$AT_JSON" \
          --argjson skipped "$SKIPPED_JSON" \
          '{
            pr_number: $pr_number,
            deployment_id: $deployment_id,
            reason: $reason,
            state_resource_count: $state_resource_count,
            init_success: $init_success,
            destroy_error: $destroy_error,
            destroy_success: $destroy_success,
            already_terminated: $already_terminated,
            skipped: $skipped
          }' > "${GITHUB_WORKSPACE}/terminate-result.json"

        cat "${GITHUB_WORKSPACE}/terminate-result.json"

    - name: Upload terminate-result artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: terminate-result
        path: terminate-result.json
        retention-days: 7

  prepare-notify:
    name: Prepare Termination Notification
    needs: [resolve, terminate]
    if: |
      always() &&
      needs.resolve.outputs.should_run == 'true' &&
      (needs.terminate.result == 'success' || needs.terminate.result == 'failure')
    runs-on: ubuntu-latest
    outputs:
      should_deliver: ${{ steps.message.outputs.should_deliver }}
      pr_number: ${{ steps.message.outputs.pr_number }}
      pr_body: ${{ steps.message.outputs.pr_body }}
    steps:
    - name: Download terminate-result artifact
      uses: actions/download-artifact@v8
      with:
        name: terminate-result

    - name: Build termination notification
      id: message
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_PR }}
      run: |
        set -euo pipefail
        if [ ! -f terminate-result.json ]; then
          echo "No terminate-result artifact — termination was skipped"
          echo "should_deliver=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        PR_NUMBER=$(jq -r '.pr_number' terminate-result.json)
        DEPLOYMENT_ID=$(jq -r '.deployment_id' terminate-result.json)
        REASON=$(jq -r '.reason' terminate-result.json)
        INIT_SUCCESS=$(jq -r '.init_success // true' terminate-result.json)
        DESTROY_SUCCESS=$(jq -r '.destroy_success' terminate-result.json)
        SKIPPED=$(jq -r '.skipped' terminate-result.json)
        DESTROY_ERROR=$(jq -r '.destroy_error // empty' terminate-result.json)
        STATE_COUNT=$(jq -r '.state_resource_count // 0' terminate-result.json)

        if [ "$SKIPPED" = "true" ]; then
          echo "Termination skipped — no resources in S3 state"
          echo "should_deliver=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$INIT_SUCCESS" = "false" ]; then
          PR_BODY="## ❌ Termination Failed

        **Deployment:** ${DEPLOYMENT_ID}
        **Reason:** ${REASON}
        **Error:** Could not load Terraform state from S3. Check backend credentials and state key."
          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg deployment "$DEPLOYMENT_ID" \
            --arg reason "$REASON" \
            --arg url "$RUN_URL" \
            '{
              text: "❌ PR Deployment Termination Failed",
              attachments: [{
                color: "danger",
                fields: [
                  {title: "PR Number", value: $pr, short: true},
                  {title: "Deployment ID", value: $deployment, short: true},
                  {title: "Reason", value: $reason, short: true},
                  {title: "Error", value: "Could not load Terraform state from S3", short: false},
                  {title: "Workflow Run", value: $url, short: false}
                ]
              }]
            }' > slack-payload.json
        elif [ "$DESTROY_SUCCESS" = "true" ]; then
          case "$REASON" in
            scheduled)
              PR_BODY="## ✅ Auto-Termination Completed

        **Deployment:** ${DEPLOYMENT_ID}
        **Result:** Successfully destroyed after scheduled wait"
              SLACK_TEXT="✅ PR Deployment Auto-Terminated"
              ;;
            failure_cleanup)
              PR_BODY="## ✅ Failed Deployment Cleaned Up

        **Deployment:** ${DEPLOYMENT_ID}
        **Result:** Partial resources destroyed after deploy failure"
              SLACK_TEXT="✅ PR Deployment Cleaned Up After Failure"
              ;;
            *)
              PR_BODY="## ✅ PR Deployment Terminated

        **Deployment:** ${DEPLOYMENT_ID}
        **Result:** Successfully destroyed (manual)"
              SLACK_TEXT="✅ PR Deployment Terminated (Manual)"
              ;;
          esac
          jq -n \
            --arg text "$SLACK_TEXT" \
            --arg pr "$PR_NUMBER" \
            --arg deployment "$DEPLOYMENT_ID" \
            --arg reason "$REASON" \
            --arg url "$RUN_URL" \
            '{
              text: $text,
              attachments: [{
                color: "good",
                fields: [
                  {title: "PR Number", value: $pr, short: true},
                  {title: "Deployment ID", value: $deployment, short: true},
                  {title: "Reason", value: $reason, short: true},
                  {title: "Workflow Run", value: $url, short: false}
                ]
              }]
            }' > slack-payload.json
        else
          PR_BODY="## ❌ Termination Failed

        **Deployment:** ${DEPLOYMENT_ID}
        **Reason:** ${REASON}
        **State resources:** ${STATE_COUNT}
        **Error:** Cleanup/termination did not complete successfully. S3 state retained for retry.
        **Details:** ${DESTROY_ERROR:-Check workflow logs.}"
          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg deployment "$DEPLOYMENT_ID" \
            --arg reason "$REASON" \
            --arg url "$RUN_URL" \
            --arg state_count "$STATE_COUNT" \
            --arg details "${DESTROY_ERROR:-Check workflow logs.}" \
            '{
              text: "❌ PR Deployment Termination Failed",
              attachments: [{
                color: "danger",
                fields: [
                  {title: "PR Number", value: $pr, short: true},
                  {title: "Deployment ID", value: $deployment, short: true},
                  {title: "Reason", value: $reason, short: true},
                  {title: "State resources", value: $state_count, short: true},
                  {title: "Error", value: "Cleanup did not complete. S3 state retained for retry.", short: false},
                  {title: "Details", value: $details, short: false},
                  {title: "Workflow Run", value: $url, short: false}
                ]
              }]
            }' > slack-payload.json
        fi

        echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        {
          echo "pr_body<<EOF"
          echo "$PR_BODY"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        SHOULD_DELIVER=false
        if [ -n "$SLACK_WEBHOOK" ] && [ -f slack-payload.json ]; then
          SHOULD_DELIVER=true
        fi
        if [ -n "$PR_NUMBER" ] && [ -n "$PR_BODY" ]; then
          SHOULD_DELIVER=true
        fi
        echo "should_deliver=${SHOULD_DELIVER}" >> "$GITHUB_OUTPUT"

    - name: Upload Slack payload
      if: steps.message.outputs.should_deliver == 'true' && hashFiles('slack-payload.json') != ''
      uses: actions/upload-artifact@v7
      with:
        name: notify-payload
        path: slack-payload.json
        retention-days: 1

  notify:
    name: Notify Termination Result
    needs: prepare-notify
    if: needs.prepare-notify.outputs.should_deliver == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Download Slack payload
      uses: actions/download-artifact@v8
      with:
        name: notify-payload
      continue-on-error: true

    - uses: ./.github/actions/notify
      with:
        slack_webhook: ${{ secrets.SLACK_WEBHOOK_PR }}
        pr_number: ${{ needs.prepare-notify.outputs.pr_number }}
        pr_body: ${{ needs.prepare-notify.outputs.pr_body }}
